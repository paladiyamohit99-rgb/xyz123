<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorting Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Sorting Visualizer</h1>
  </header>

  <div class="controls">
    <label>Size:</label>
    <input id="a_size" type="range" min="10" max="100" value="50" />
    <label>Speed:</label>
    <input id="a_speed" type="range" min="1" max="100" value="50" />
    <button id="a_generate">Generate New Array</button>
  </div>

  <div class="algos">
    <button>Bubble</button>
    <button>Selection</button>
    <button>Insertion</button>
    <button>Merge</button>
    <button>Quick</button>
    <button>Heap</button>
  </div>

  <div id="array_container"></div>

  <script src="scripts/main.js"></script>
  <script src="scripts/bubble.js"></script>
  <script src="scripts/selection.js"></script>
  <script src="scripts/insertion.js"></script>
  <script src="scripts/merge.js"></script>
  <script src="scripts/quick.js"></script>
  <script src="scripts/heap.js"></script>
</body>
</html>
